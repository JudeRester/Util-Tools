<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UtilTools Quick Widget</title>
    <link rel="icon" type="image/x-icon" href="utiltools.ico">
    <link rel="stylesheet" href="widget.css">
    <!-- Eel RPC 백엔드 연동 -->
    <script type="text/javascript" src="/eel.js"></script>
</head>
<body class="edge-right state-collapsed">
    <!-- 1. 초슬림 엣지 핸들 (20px x 120px) -->
    <div id="edge-handle" class="edge-handle pywebview-drag-region" title="마우스 오버 시 확장 / 드래그하여 이동">
        <div class="handle-pill">
            <span class="handle-grip"></span>
        </div>
    </div>

    <!-- 2. 확장 퀵 위젯 패널 (380px x 620px) -->
    <div id="widget-panel" class="widget-panel">
        <!-- 상단 헤더 (드래그 가능 영역) -->
        <header class="widget-header pywebview-drag-region">
            <div class="header-title">
                <span class="header-icon">🛠️</span>
                <span class="header-text">Quick Widget</span>
            </div>
            <div class="header-controls">
                <div class="size-dropdown-wrapper">
                    <button id="btn-size-menu" class="ctrl-btn" title="핸들 크기 조절">📏</button>
                    <div id="size-menu-dropdown" class="size-dropdown">
                        <div class="size-dropdown-header">핸들 크기 설정</div>
                        <button class="size-opt-btn active" data-size="slim">
                            <span class="size-name">슬림 (추천)</span>
                            <span class="size-dim">12 × 70px</span>
                            <span class="size-check">✓</span>
                        </button>
                        <button class="size-opt-btn" data-size="default">
                            <span class="size-name">기본</span>
                            <span class="size-dim">20 × 120px</span>
                            <span class="size-check">✓</span>
                        </button>
                        <button class="size-opt-btn" data-size="compact">
                            <span class="size-name">컴팩트</span>
                            <span class="size-dim">8 × 50px</span>
                            <span class="size-check">✓</span>
                        </button>
                    </div>
                </div>
                <button id="btn-pin" class="ctrl-btn" title="창 고정 (마우스 벗어나도 닫히지 않음)">📌</button>
                <button id="btn-open-main" class="ctrl-btn" title="메인 앱 열기">🗔</button>
                <button id="btn-collapse" class="ctrl-btn" title="접기">✕</button>
            </div>
        </header>

        <!-- 퀵 위젯 탭 네비게이션 -->
        <nav class="widget-tabs">
            <button class="wtab-btn active" data-tab="launch">⚡ 빠른 실행</button>
            <button class="wtab-btn" data-tab="memo">📝 퀵 메모</button>
            <button class="wtab-btn" data-tab="system">📊 시스템</button>
        </nav>

        <!-- 탭 컨텐츠 영역 -->
        <main class="widget-body">
            <!-- 탭 1: 빠른 실행 -->
            <section id="wtab-launch" class="wtab-content active">
                <div class="section-title-row">
                    <span>자주 쓰는 도구</span>
                    <button id="btn-refresh-launch" class="mini-action-btn" title="새로고침">🔄</button>
                </div>
                <div id="quick-launch-list" class="quick-launch-grid">
                    <!-- JS 동적 렌더링 -->
                    <div class="launch-empty">프로그램 목록을 불러오는 중...</div>
                </div>
            </section>

            <!-- 탭 2: 퀵 메모 -->
            <section id="wtab-memo" class="wtab-content">
                <div class="section-title-row">
                    <span>간편 메모장</span>
                    <span id="memo-status" class="status-indicator">자동 저장됨</span>
                </div>
                <textarea id="widget-memo-input" class="widget-memo-area" placeholder="여기에 빠른 메모를 작성하세요... (자동 저장)"></textarea>
            </section>

            <!-- 탭 3: 시스템 상태 -->
            <section id="wtab-system" class="wtab-content">
                <div class="section-title-row">
                    <span>실시간 리소스</span>
                    <button id="btn-refresh-sys" class="mini-action-btn" title="새로고침">🔄</button>
                </div>
                <div class="system-metric-cards">
                    <div class="metric-card">
                        <div class="metric-label">CPU 사용률</div>
                        <div class="metric-value-row">
                            <span id="metric-cpu-val" class="metric-val">--%</span>
                            <div class="progress-track"><div id="metric-cpu-bar" class="progress-fill" style="width: 0%"></div></div>
                        </div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">메모리 사용률</div>
                        <div class="metric-value-row">
                            <span id="metric-mem-val" class="metric-val">--%</span>
                            <div class="progress-track"><div id="metric-mem-bar" class="progress-fill" style="width: 0%"></div></div>
                        </div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-label">배터리 / 전원</div>
                        <div class="metric-detail" id="metric-power-val">조회 중...</div>
                    </div>
                </div>

                <!-- 시스템 제어 (재시작 / 종료) -->
                <div class="section-title-row" style="margin-top: 16px;">
                    <span>시스템 제어</span>
                </div>
                <div class="system-power-grid">
                    <button id="btn-widget-restart" class="sys-power-btn btn-restart" title="백엔드 서버 및 위젯 즉시 재시작">
                        <span class="power-btn-icon">🔄</span>
                        <div class="power-btn-content">
                            <span class="power-btn-title">앱 재시작</span>
                            <span class="power-btn-sub">코드/설정 갱신</span>
                        </div>
                    </button>
                    <button id="btn-widget-shutdown" class="sys-power-btn btn-shutdown" title="애플리케이션 및 시스템 트레이 완전 종료">
                        <span class="power-btn-icon">🚪</span>
                        <div class="power-btn-content">
                            <span class="power-btn-title">완전 종료</span>
                            <span class="power-btn-sub">프로세스 완전 회수</span>
                        </div>
                    </button>
                </div>
            </section>
        </main>

        <!-- 비차단 인레이어 확인 모달 (Non-blocking In-layer Modal) -->
        <div id="widget-modal-overlay" class="widget-modal-overlay" style="display: none;">
            <div class="widget-modal-dialog">
                <div class="widget-modal-header">
                    <span id="widget-modal-icon" class="widget-modal-icon">🔄</span>
                    <span id="widget-modal-title" class="widget-modal-title">확인</span>
                </div>
                <div id="widget-modal-msg" class="widget-modal-msg">내용</div>
                <div class="widget-modal-actions">
                    <button id="widget-modal-btn-cancel" class="widget-modal-btn btn-cancel">취소</button>
                    <button id="widget-modal-btn-confirm" class="widget-modal-btn btn-confirm">확인</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/widget.js"></script>
</body>
</html>
